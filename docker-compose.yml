version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airq-backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - DATABASE_URL=sqlite:///./data/air_quality.db
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    restart: unless-stopped
    networks:
      - airq-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airq-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - airq-network

volumes:
  backend-data:

networks:
  airq-network:
    driver: bridge
